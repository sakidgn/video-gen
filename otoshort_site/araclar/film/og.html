<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../saas/static/fonts/fonts.css">
<style>
html,body{margin:0;font-variant-numeric:lining-nums;width:1200px;height:630px;overflow:hidden;background:#0c0b0a;color:#f4efe6;font-family:"Plus Jakarta Sans",sans-serif}
.bg{position:absolute;inset:0;background:url(kareler/0/0400.jpg) 70% 50%/cover no-repeat}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,11,10,.95) 0%,rgba(12,11,10,.7) 38%,rgba(12,11,10,0) 62%)}
.copy{position:absolute;left:72px;bottom:70px;display:grid;gap:22px}
.brand{display:flex;align-items:center;gap:12px;font-family:"Cormorant Garamond";font-weight:500;font-size:34px}
.mark{width:40px;height:40px;border-radius:12px;background:#f4efe6;display:grid;place-items:center}
.mark:after{content:"";border-left:12px solid #0c0b0a;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:4px}
h1{margin:0;font-family:"Cormorant Garamond";font-weight:500;font-size:96px;line-height:.95}
h1 em{color:#d8b98a}
p{margin:0;font-size:22px;color:#bdb5a8;max-width:520px;line-height:1.45}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="copy">
  <div class="brand"><span class="mark"></span>Cutless</div>
  <h1>Fikir senden,<br><em>video</em> bizden.</h1>
  <p>Yapay zekâ ile sesli, dikey TikTok, Reels ve Shorts videoları.</p>
</div>
</body></html>
