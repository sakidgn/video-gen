<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../saas/static/fonts/fonts.css">
<style>
html,body{margin:0;font-variant-numeric:lining-nums;width:1200px;height:630px;overflow:hidden;background:#0c0b0a;color:#f4efe6;font-family:"Plus Jakarta Sans",sans-serif}
.bg{position:absolute;inset:0;background:url(kareler/0/0335.jpg) 70% 50%/cover no-repeat}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,11,10,.95) 0%,rgba(12,11,10,.7) 38%,rgba(12,11,10,0) 62%)}
.copy{position:absolute;left:72px;bottom:62px;display:grid;gap:20px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:34px;letter-spacing:-.035em}
.mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(150deg,#ffe9a8,#f5b84a 60%,#e8913a);display:grid;place-items:center;box-shadow:0 8px 24px -8px rgba(245,184,74,.6)}
h1{margin:0;font-family:"Cormorant Garamond";font-weight:500;font-size:78px;line-height:1}
h1 em{color:#d8b98a}
p{margin:0;font-size:22px;color:#bdb5a8;max-width:520px;line-height:1.45}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="copy">
  <div class="brand"><span class="mark"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M14.2 1.8 4.6 13.4c-.35.42-.05 1.06.5 1.06h5.5l-1.85 7.3c-.13.52.53.84.87.42l9.7-11.7c.35-.42.05-1.06-.5-1.06h-5.5l1.75-7.2c.13-.52-.53-.84-.87-.42z" fill="#1a1206"/></svg></span>Zaply</div>
  <h1 data-en="Reels, TikTok and<br>Shorts videos,<br><em>on autopilot.</em>">Reels, TikTok ve<br>Shorts için<br><em>otomatik video.</em></h1>
  <p data-en="Write your idea and let AI make a vertical video with sound.">Fikrini yaz, yapay zekâ sesli ve dikey videoyu üretsin.</p>
</div>
<script>
// ?lang=en: İngilizce paylaşım görseli (og-en.png); arka plan İngilizce filmin karesinden
if (new URLSearchParams(location.search).get('lang') === 'en') {
  document.documentElement.lang = 'en';
  document.querySelectorAll('[data-en]').forEach(e => { e.innerHTML = e.dataset.en; });
  document.querySelector('.bg').style.backgroundImage = 'url(kareler-en/0/0335.jpg)';
}
</script>
</body></html>
