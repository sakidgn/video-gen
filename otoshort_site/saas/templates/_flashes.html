{% if flashes %}<div class="flashes">{% for f in flashes %}{% set kind, msg = f[0], f[1] %}
<div class="flash {{ kind }}">{{ icon({'ok':'check','demo':'mail'}.get(kind, 'alert'), 16) }}<div>{{ msg }}{% if f|length > 2 and f[2] %} <a href="{{ f[2] }}" target="_blank" rel="noopener">{{ f[3] or _('Aç') }} →</a>{% endif %}</div></div>
{% endfor %}</div>{% endif %}
