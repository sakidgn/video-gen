{% extends "base.html" %}
{% block title %}{{ _('Yeni şifre') }} · {{ site }}{% endblock %}
{% block content %}
<div class="auth"><div class="auth-card reveal">
  <h1>{{ _('Yeni şifreni belirle') }}</h1>
  <p class="sub">{{ _('En az 8 karakterli, tahmin edilmesi zor bir şifre seç.') }}</p>
  <form class="card card-lg stack" method="post" action="/sifre-yenile/{{ token }}" style="gap:0">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="field"><label class="label" for="pw">{{ _('Yeni şifre') }}</label><input class="input" id="pw" name="password" type="password" minlength="8" required autocomplete="new-password"></div>
    <div class="field"><label class="label" for="pw2">{{ _('Yeni şifre (tekrar)') }}</label><input class="input" id="pw2" name="password2" type="password" minlength="8" required autocomplete="new-password"></div>
    <button class="btn btn-primary btn-lg btn-block" type="submit" style="margin-top:26px">{{ icon('lock', 17) }} {{ _('Şifremi güncelle') }}</button>
  </form>
</div></div>
{% endblock %}
