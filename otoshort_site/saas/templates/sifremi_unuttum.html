{% extends "base.html" %}
{% block title %}{{ _('Şifremi unuttum') }} · {{ site }}{% endblock %}
{% block content %}
<div class="auth"><div class="auth-card reveal">
  <h1>{{ _('Şifreni mi unuttun?') }}</h1>
  <p class="sub">{{ _('E-postanı yaz, sana yeni şifre belirleme bağlantısı gönderelim.') }}</p>
  <form class="card card-lg stack" method="post" action="/sifremi-unuttum" style="gap:0">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="field"><label class="label" for="email">{{ _('E-posta') }}</label><input class="input" id="email" name="email" type="email" required autocomplete="email" placeholder="{{ _('sen@ornek.com') }}"></div>
    <button class="btn btn-primary btn-lg btn-block" type="submit" style="margin-top:26px">{{ icon('mail', 17) }} {{ _('Bağlantı gönder') }}</button>
  </form>
  <p class="center muted small"><a href="{{ L('/giris') }}" style="color:var(--text)">{{ icon('arrow-left', 14) }} {{ _('Girişe dön') }}</a></p>
</div></div>
{% endblock %}
