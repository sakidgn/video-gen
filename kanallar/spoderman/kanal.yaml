# Yeni kanal açmak için bu klasörü kopyala (kanallar/<yeni_ad>/) ve alanları değiştir.
ad: Spoderman & Orange
dil: tr  # diyalog, başlık ve açıklama dili (tr, en, ...)

karakterler:
  - ad: Spoderman
    # Gemini telif yüzünden reddederse promptta ad bununla değiştirilir ve tarif başa eklenir.
    video_adi: the costume guy
    diger_adlar: [Spider-Man, Spiderman, Spider Man, Örümcek Adam]
    tarif: >
      a skinny goofy guy in a cheap, badly homemade red and blue full-body suit with a saggy
      red mask that has huge lopsided white eye patches, like a bootleg party-store superhero
      costume from an old internet meme; confident but clueless body language
    referans: karakterler/spoderman.png
  - ad: Orange
    video_adi: the talking orange
    diger_adlar: [Annoying Orange]
    tarif: >
      a real orange fruit with a cartoonish human face (big expressive eyes and a wide mouth),
      high-pitched annoying voice, constantly laughing at its own jokes
    referans: karakterler/orange.png

stil: >
  cheap janky 3D video game look like a 2000s sandbox-game machinima: low-poly models,
  blurry low-res textures, flat default lighting, stiff robotic animations, silly broken
  physics, objects clipping and floating, choppy game-engine camera. Definitely NOT
  realistic and NOT live-action; everything clearly looks like a cheap game

hashtagler: [shorts, spoderman, annoyingorange, meme, ai]

kurallar:
  - Orange always interrupts or laughs obnoxiously at the worst moment.
  - Spoderman takes everything way too seriously.
  - End on a sudden cut right after the punchline.
  - Use game-engine glitches as jokes (clipping, T-posing, floating objects, bad lip-sync).

temalar:
  - lost in an IKEA store arguing over the last meatball
  - a neighborhood barber shop giving a hopelessly weird haircut
  - haggling over tomatoes at a Turkish street bazaar
  - brewing Turkish tea in zero gravity on the International Space Station
  - squeezed against the door of a packed Istanbul metrobus at rush hour
  - taking awkward selfies with a dinosaur skeleton in a history museum
  - tricking the waiter to skip the bill at a fancy restaurant
  - fixing a modified Tofaş car at an industrial repair shop
  - trying to scare the monsters in a haunted house
  - a job interview at a fast food restaurant
  - a school parent-teacher meeting
  - a Turkish wedding dance floor during the halay
  - a gym where the trainer only speaks in motivational quotes
  - a cooking competition show live on TV
  - a driving test with a terrified examiner

senaryo:
  # chatgpt_web: senaryoyu tarayıcıdaki ChatGPT projen yazar | gemini_api: Gemini API yazar
  motor: chatgpt_web
  chatgpt_proje: shitpost gen   # ChatGPT'deki proje adı
  chatgpt_mesaj: Daha önce yapmadığın komik bir prompt yaz.   # projeye her seferinde yazılan mesaj
  # Proje adla bulunamazsa gidilecek link (ChatGPT'de projeyi açınca adres çubuğundaki link)
  chatgpt_url: https://chatgpt.com/g/g-p-6a88edf62bc8819180ea36996d0b832d-shitpost-gen/project

modeller:
  metin: gemini-3.8-flash
  gorsel: gemini-3.1-flash-image
  video: veo-3.1-generate-preview   # daha ucuz: veo-3.1-lite-generate-preview

video:
  motor: gemini_web   # gemini_web: Gemini uygulaması (AI Pro hesapları) | api: Veo API (kart gerekir)
  en_boy: "9:16"
  cozunurluk: 720p
  sure: 8

platformlar:
  youtube_web: {}   # YouTube Studio'ya tarayıcıdan yükler (Google Cloud kurulumu gerekmez)
  # Google Cloud'dan client_secret.json alırsan resmi API ile:
  # youtube:
  #   token_env: YOUTUBE_TOKEN_SPODERMAN
  #   gizlilik: public
  tiktok_web: {}
  instagram_web: {}
  # Kartın olursa TikTok/IG için tarayıcı yerine Ayrshare:
  # ayrshare:
  #   profil_env: AYRSHARE_PROFILE_SPODERMAN
  #   platformlar: [tiktok, instagram]
