{% extends "base.html" %}
{% block title %}Giriş · {{ site }}{% endblock %}
{% block content %}
<div class="wrap"><div class="card auth">
  <h2>Tekrar hoş geldin 👋</h2>
  <form method="post" action="/giris">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>E-posta</label><input name="email" type="email" required autocomplete="email">
    <label>Şifre</label><input name="password" type="password" required autocomplete="current-password">
    <button class="btn" style="width:100%;margin-top:18px">Giriş yap</button>
  </form>
  <p class="muted" style="margin-top:16px">Hesabın yok mu? <a href="/kayit">Kayıt ol</a></p>
</div></div>
{% endblock %}
